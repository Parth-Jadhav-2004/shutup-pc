<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Laptop Remote</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --row-line: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #98989f;
      --blue: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --purple: #bf5af2;
      --track: #39393d;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
      min-height: 100vh;
      touch-action: manipulation;
    }
    main { width: min(480px, 100%); margin: 0 auto; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin: 8px 4px 2px; }
    .eyebrow { color: var(--muted); font-size: 13px; }
    h1 { margin: 0; font-size: 34px; letter-spacing: -0.5px; }
    .pill {
      font-size: 13px; font-weight: 700;
      padding: 6px 12px; border-radius: 999px;
      background: var(--card); color: var(--muted);
    }
    .pill.on { background: rgba(48, 209, 88, 0.15); color: var(--green); }
    .group-title {
      margin: 24px 16px 6px;
      color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .card { background: var(--card); border-radius: 20px; margin-top: 14px; overflow: hidden; }
    .card.pad { padding: 16px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      width: 100%; min-height: 58px; padding: 12px 16px;
      background: none; border: 0; color: var(--text);
      font: inherit; text-align: left; cursor: pointer;
    }
    .row + .row { border-top: 1px solid var(--row-line); }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 17px; }
    .row .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .row.danger .name { color: var(--red); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #48484a; flex: none; }
    .dot.on { background: var(--green); box-shadow: 0 0 8px rgba(48, 209, 88, 0.8); }
    .dot.blue { background: var(--blue); }
    .dot.purple { background: var(--purple); }
    .dot.orange { background: var(--orange); }
    .dot.red { background: var(--red); }
    .sw {
      position: relative; flex: none;
      width: 51px; height: 31px; border-radius: 999px;
      background: var(--track); transition: background 0.2s;
    }
    .sw::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 27px; height: 27px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s;
    }
    .sw.on { background: var(--green); }
    .sw.on::after { transform: translateX(20px); }
    .row:disabled { opacity: 0.5; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
    .stat { background: #2c2c2e; border-radius: 14px; padding: 12px 8px; text-align: center; }
    .stat b { font-size: 20px; display: block; }
    .stat span { font-size: 12px; color: var(--muted); }
    label.f-label { display: block; color: var(--muted); font-size: 13px; margin: 10px 2px 0; }
    input[type="password"], input[type="url"] {
      width: 100%; margin-top: 6px;
      background: #2c2c2e; border: 0; border-radius: 12px;
      color: var(--text); padding: 14px; font-size: 17px; font-family: inherit;
    }
    .btn {
      display: block; width: 100%; margin-top: 16px;
      background: var(--blue); border: 0; border-radius: 14px;
      min-height: 50px; font-size: 17px; font-weight: 600; color: #fff;
      font-family: inherit; cursor: pointer;
    }
    .hint { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .error { color: var(--red); font-size: 14px; }
    input[type="range"] { width: 100%; accent-color: var(--blue); height: 36px; margin: 4px 0 0; }
    .preview { display: none; width: calc(100% - 32px); margin: 4px 16px 14px; border-radius: 12px; }
    .preview.show { display: block; }
    .toast { color: var(--muted); text-align: center; min-height: 22px; font-size: 14px; margin-top: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="nav">
      <div>
        <div class="eyebrow">My Laptop</div>
        <h1 id="deviceName">Laptop</h1>
      </div>
      <div id="state" class="pill">Connecting</div>
    </div>
    <p class="hint" id="subtitle" style="margin: 4px 4px 0;">Sign in with the permanent laptop password.</p>

    <section id="login" class="card pad">
      <label class="f-label" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="btn" id="loginBtn" type="button">Connect</button>
      <p class="hint">This password stays on the laptop. Set or reset it from the setup page on the PC.</p>
      <p class="error" id="loginError"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card stats">
        <div class="stat"><b id="battery">—</b><span>Battery</span></div>
        <div class="stat"><b id="cpu">—</b><span>CPU</span></div>
        <div class="stat"><b id="ram">—</b><span>RAM</span></div>
      </div>

      <div class="group-title">Hermes Agent</div>
      <div class="card" id="services"><div class="row"><div class="info"><div class="name">Loading…</div></div></div></div>

      <div class="group-title">Media</div>
      <div class="card">
        <div class="row" style="cursor: default;">
          <div class="info">
            <div class="name">Volume</div>
            <input id="volume" type="range" min="0" max="100" value="50" />
          </div>
        </div>
        <button class="row" id="muteRow" type="button" role="switch" aria-checked="false">
          <div class="info"><div class="name">Mute</div><div class="sub" id="volumeValue">—</div></div>
          <span class="sw" id="muteSw"></span>
        </button>
        <button class="row" id="screenshotRow" type="button">
          <div class="info"><div class="name">Screenshot</div><div class="sub">Tap to capture the laptop screen</div></div>
          <span class="sw" id="shotSw"></span>
        </button>
      </div>
      <img id="preview" class="preview" alt="Laptop screenshot" />

      <div class="group-title">Power</div>
      <div class="card">
        <button class="row" type="button" data-power="sleep">
          <span class="dot blue"></span>
          <div class="info"><div class="name">Sleep</div><div class="sub">Suspend now</div></div>
          <span class="sw"></span>
        </button>
        <button class="row" type="button" data-power="lock">
          <span class="dot purple"></span>
          <div class="info"><div class="name">Lock</div><div class="sub">Lock the workstation</div></div>
          <span class="sw"></span>
        </button>
        <button class="row" type="button" data-power="restart" data-confirm="Restart the laptop? Open apps may close.">
          <span class="dot orange"></span>
          <div class="info"><div class="name">Restart</div><div class="sub">Reboot the laptop</div></div>
          <span class="sw"></span>
        </button>
        <button class="row danger" type="button" data-power="shutdown" data-confirm="Shut down the laptop? You will not be able to start it from this page.">
          <span class="dot red"></span>
          <div class="info"><div class="name">Shut Down</div><div class="sub">Power off completely</div></div>
          <span class="sw"></span>
        </button>
      </div>

      <div class="card">
        <button class="row danger" id="logout" type="button">
          <div class="info"><div class="name">Sign Out</div><div class="sub">Sign out on this browser</div></div>
        </button>
      </div>
      <p class="toast" id="message"></p>
    </section>
  </main>
  <script>
    const TOKEN_KEY = "laptop-remote-token";
    function apiRoot() {
      const path = location.pathname.replace(/\/+$/, "") || "/";
      if (path.endsWith("/app")) {
        return path.slice(0, -4) || "";
      }
      return path === "/" ? "" : path;
    }
    function api(path) {
      return apiRoot() + "/api/v1" + path;
    }
    async function request(path, options = {}) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = { Accept: "application/json", ...(options.headers || {}) };
      if (options.body && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }
      if (token) {
        headers.Authorization = "Bearer " + token;
      }
      const response = await fetch(api(path), { ...options, headers });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.detail || "Request failed");
      }
      return payload;
    }

    const loginEl = document.getElementById("login");
    const dashEl = document.getElementById("dashboard");
    const loginError = document.getElementById("loginError");
    const message = document.getElementById("message");

    function setSw(el, on) {
      el.classList.toggle("on", !!on);
    }

    function showDashboard() {
      loginEl.classList.add("hidden");
      dashEl.classList.remove("hidden");
      document.getElementById("subtitle").textContent = "Controls stay available until you sign out of this browser.";
      refresh();
    }
    function showLogin() {
      dashEl.classList.add("hidden");
      loginEl.classList.remove("hidden");
    }

    async function login() {
      loginError.textContent = "";
      try {
        const result = await request("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            password: document.getElementById("password").value,
            client_name: "Web",
          }),
        });
        localStorage.setItem(TOKEN_KEY, result.device_token);
        document.getElementById("deviceName").textContent = result.device_name;
        showDashboard();
        startStatusTimer();
      } catch (error) {
        loginError.textContent = error.message;
      }
    }

    async function fetchBinary(path) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = {};
      if (token) {
        headers.Authorization = "Bearer " + token;
      }
      const response = await fetch(api(path), { headers });
      if (!response.ok) {
        throw new Error("Screenshot failed");
      }
      return response.blob();
    }

    function applyVolume(vol) {
      document.getElementById("volume").value = String(vol.volume_percent);
      document.getElementById("volumeValue").textContent = vol.volume_percent + "%";
      const row = document.getElementById("muteRow");
      row.setAttribute("aria-checked", vol.muted ? "true" : "false");
      setSw(document.getElementById("muteSw"), vol.muted);
      row.querySelector(".name").textContent = vol.muted ? "Unmute" : "Mute";
    }

    async function loadVolume() {
      applyVolume(await request("/media/volume"));
    }

    async function setVolume(payload) {
      applyVolume(await request("/media/volume", { method: "POST", body: JSON.stringify(payload) }));
    }

    let volumeTimer = null;
    function queueVolume(percent) {
      document.getElementById("volumeValue").textContent = percent + "%";
      clearTimeout(volumeTimer);
      volumeTimer = setTimeout(() => {
        void setVolume({ volume_percent: percent }).catch((error) => {
          message.textContent = error.message;
        });
      }, 180);
    }

    async function loadScreenshot(btn) {
      const sw = document.getElementById("shotSw");
      setSw(sw, true);
      message.textContent = "Capturing…";
      try {
        const blob = await fetchBinary("/media/screenshot");
        const img = document.getElementById("preview");
        if (img.dataset.url) {
          URL.revokeObjectURL(img.dataset.url);
        }
        const url = URL.createObjectURL(blob);
        img.dataset.url = url;
        img.src = url;
        img.classList.add("show");
        message.textContent = "Screenshot updated";
      } catch (error) {
        message.textContent = error.message;
      } finally {
        setTimeout(() => setSw(sw, false), 600);
      }
    }

    function renderServices(services) {
      const box = document.getElementById("services");
      box.innerHTML = "";
      for (const svc of services) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row";
        btn.setAttribute("role", "switch");
        btn.setAttribute("aria-checked", svc.running ? "true" : "false");
        const port = svc.port != null ? " · :" + svc.port : "";
        const proc = svc.process_name ? " · " + svc.process_name : "";
        const name = document.createElement("div");
        name.className = "info";
        const title = document.createElement("div");
        title.className = "name";
        title.textContent = svc.name;
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = (svc.running ? "On" : "Off") + port + proc;
        name.appendChild(title);
        name.appendChild(sub);
        const dot = document.createElement("span");
        dot.className = "dot" + (svc.running ? " on" : "");
        const sw = document.createElement("span");
        sw.className = "sw" + (svc.running ? " on" : "");
        btn.appendChild(dot);
        btn.appendChild(name);
        btn.appendChild(sw);
        btn.addEventListener("click", () => toggleService(svc, btn));
        box.appendChild(btn);
      }
    }

    async function loadServices() {
      try {
        const result = await request("/services");
        renderServices(result.services || []);
      } catch (error) {
        document.getElementById("services").innerHTML =
          '<div class="row"><div class="info"><div class="name">Services unavailable</div></div></div>';
      }
    }

    async function toggleService(svc, btn) {
      btn.disabled = true;
      const sw = btn.querySelector(".sw");
      const dot = btn.querySelector(".dot");
      const willRun = btn.getAttribute("aria-checked") !== "true";
      btn.setAttribute("aria-checked", willRun ? "true" : "false");
      setSw(sw, willRun);
      try {
        const result = await request("/services/" + svc.id + "/toggle", {
          method: "POST",
          body: "{}",
        });
        message.textContent = result.message || "Service toggled";
        await loadServices();
        void refreshState();
      } catch (error) {
        message.textContent = error.message;
        btn.setAttribute("aria-checked", willRun ? "false" : "true");
        setSw(sw, !willRun);
      } finally {
        btn.disabled = false;
      }
    }

    async function refreshState() {
      try {
        const status = await request("/status");
        document.getElementById("deviceName").textContent = status.device_name;
        const pill = document.getElementById("state");
        pill.textContent = "Online";
        pill.className = "pill on";
        document.getElementById("battery").textContent =
          status.battery_percent == null ? "AC" : status.battery_percent + "%";
        document.getElementById("cpu").textContent = Math.round(status.cpu_percent) + "%";
        document.getElementById("ram").textContent =
          status.ram_used_gb.toFixed(1) + " / " + status.ram_total_gb.toFixed(0) + " GB";
      } catch (error) {
        const pill = document.getElementById("state");
        pill.textContent = "Offline";
        pill.className = "pill";
        message.textContent = error.message;
        throw error;
      }
    }

    async function refresh() {
      try {
        await refreshState();
        await loadVolume();
        await loadServices();
      } catch (error) {
        /* state already shown */
      }
    }

    async function power(command, btn) {
      const row = btn.closest(".row");
      const sw = row ? row.querySelector(".sw") : null;
      const confirmText = btn.dataset.confirm;
      if (confirmText && !confirm(confirmText)) {
        return;
      }
      if (sw) {
        setSw(sw, true);
      }
      try {
        const result = await request("/power/" + command, { method: "POST", body: "{}" });
        message.textContent = result.message;
      } catch (error) {
        message.textContent = error.message;
      } finally {
        setTimeout(() => {
          if (sw) {
            setSw(sw, false);
          }
        }, 800);
      }
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("password").addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });
    document.querySelectorAll("[data-power]").forEach((btn) => {
      btn.addEventListener("click", () => power(btn.dataset.power, btn));
    });
    document.getElementById("volume").addEventListener("input", (event) => {
      queueVolume(Number(event.target.value));
    });
    document.getElementById("muteRow").addEventListener("click", async () => {
      const muted = document.getElementById("muteRow").getAttribute("aria-checked") === "true";
      try {
        await setVolume({ muted: !muted });
      } catch (error) {
        message.textContent = error.message;
      }
    });
    document.getElementById("screenshotRow").addEventListener("click", () => {
      void loadScreenshot();
    });
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      showLogin();
    });

    let statusTimer = null;
    function startStatusTimer() {
      if (statusTimer) {
        return;
      }
      statusTimer = setInterval(refresh, 15000);
    }
    if (localStorage.getItem(TOKEN_KEY)) {
      showDashboard();
      startStatusTimer();
    }
  </script>
</body>
</html>
