<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Laptop Remote</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --row-line: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #98989f;
      --blue: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --purple: #bf5af2;
      --track: #39393d;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
      min-height: 100vh;
      touch-action: manipulation;
    }
    main { width: min(480px, 100%); margin: 0 auto; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin: 8px 4px 2px; }
    .eyebrow { color: var(--muted); font-size: 13px; }
    .nav-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .menu-btn {
      flex: none; width: 40px; height: 40px; padding: 0;
      border: 0; border-radius: 12px; background: var(--card); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; cursor: pointer;
    }
    .menu-btn span {
      display: block; width: 16px; height: 1.8px; border-radius: 2px; background: currentColor;
    }
    .icon-btn {
      width: 40px; height: 40px; border: 0; border-radius: 12px;
      background: #2c2c2e; color: var(--text); font-size: 22px; cursor: pointer;
    }
    .scrim {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0, 0, 0, 0.45); opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; z-index: 50; top: 0; left: 0; bottom: 0;
      width: min(320px, 86vw); padding: calc(18px + env(safe-area-inset-top)) 12px 24px;
      background: #161618; transform: translateX(-105%);
      transition: transform 0.25s cubic-bezier(.22, 1, .36, 1);
      display: flex; flex-direction: column; gap: 8px;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 12px; }
    .drawer-nav { display: flex; flex-direction: column; gap: 4px; }
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%; min-height: 52px; padding: 10px 12px;
      border: 0; border-radius: 14px; background: transparent;
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    .drawer-item.active { background: var(--card); }
    .drawer-item .mark {
      width: 36px; height: 36px; border-radius: 10px; flex: none;
      display: grid; place-items: center; background: #2c2c2e;
    }
    .drawer-item .mark svg { width: 18px; height: 18px; }
    .drawer-item .info { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
    .drawer-item .name { font-size: 17px; }
    .drawer-item .sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
    h1 { margin: 0; font-size: 34px; letter-spacing: -0.5px; }
    .pill {
      font-size: 13px; font-weight: 700;
      padding: 6px 12px; border-radius: 999px;
      background: var(--card); color: var(--muted);
    }
    .pill.on { background: rgba(48, 209, 88, 0.15); color: var(--green); }
    .group-title {
      margin: 24px 16px 6px;
      color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .card { background: var(--card); border-radius: 20px; margin-top: 14px; overflow: hidden; }
    .card.pad { padding: 16px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      width: 100%; min-height: 58px; padding: 12px 16px;
      background: none; border: 0; color: var(--text);
      font: inherit; text-align: left; cursor: pointer;
    }
    .row + .row { border-top: 1px solid var(--row-line); }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 17px; }
    .row .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .row.danger .name { color: var(--red); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #48484a; flex: none; }
    .dot.on { background: var(--green); box-shadow: 0 0 8px rgba(48, 209, 88, 0.8); }
    .dot.blue { background: var(--blue); }
    .dot.purple { background: var(--purple); }
    .dot.orange { background: var(--orange); }
    .dot.red { background: var(--red); }
    .sw {
      position: relative; flex: none;
      width: 51px; height: 31px; border-radius: 999px;
      background: var(--track); transition: background 0.2s;
    }
    .sw::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 27px; height: 27px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s;
    }
    .sw.on { background: var(--green); }
    .sw.on::after { transform: translateX(20px); }
    .logo { width: 40px; height: 40px; border-radius: 10px; flex: none; object-fit: cover; background: #111; }
    .row:disabled { opacity: 0.5; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px; }
    .stat {
      background: #2c2c2e; border-radius: 14px; padding: 12px 6px 10px;
      min-width: 0; min-height: 108px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; text-align: center;
    }
    .stat-icon {
      width: 28px; height: 28px; border-radius: 8px; flex: none;
      display: grid; place-items: center;
    }
    .stat-icon svg { width: 16px; height: 16px; display: block; }
    .stat-icon.battery { background: rgba(48, 209, 88, 0.18); color: var(--green); }
    .stat-icon.cpu { background: rgba(10, 132, 255, 0.18); color: var(--blue); }
    .stat-icon.ram { background: rgba(191, 90, 242, 0.18); color: var(--purple); }
    .stat b {
      font-size: 18px; display: block; line-height: 1.15; letter-spacing: -0.3px;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .stat span.stat-label { font-size: 12px; color: var(--muted); line-height: 1.2; }
    label.f-label { display: block; color: var(--muted); font-size: 13px; margin: 10px 2px 0; }
    input[type="password"], input[type="url"] {
      width: 100%; margin-top: 6px;
      background: #2c2c2e; border: 0; border-radius: 12px;
      color: var(--text); padding: 14px; font-size: 17px; font-family: inherit;
    }
    .btn {
      display: block; width: 100%; margin-top: 16px;
      background: var(--blue); border: 0; border-radius: 14px;
      min-height: 50px; font-size: 17px; font-weight: 600; color: #fff;
      font-family: inherit; cursor: pointer;
    }
    .hint { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .error { color: var(--red); font-size: 14px; }
    input[type="range"] { width: 100%; accent-color: var(--blue); height: 36px; margin: 4px 0 0; }
    .preview { display: none; width: calc(100% - 32px); margin: 4px 16px 14px; border-radius: 12px; }
    .preview.show { display: block; }
    .toast { color: var(--muted); text-align: center; min-height: 22px; font-size: 14px; margin-top: 16px; }
    .hidden { display: none; }
    .usage-mark {
      width: 40px; height: 40px; border-radius: 10px; flex: none;
      display: grid; place-items: center;
      background: #111111;
    }
    .usage-mark img { width: 22px; height: 22px; display: block; object-fit: contain; }
    .usage-mark.cursor img { width: 20px; height: 23px; }
    .usage-mark.antigravity img { width: 22px; height: 22px; }
    .usage-tile { padding: 14px 16px; }
    .usage-tile + .usage-tile { border-top: 1px solid var(--row-line); }
    .usage-head { display: flex; align-items: flex-start; gap: 12px; }
    .usage-meta { flex: 1; min-width: 0; }
    .usage-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .usage-plan { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .usage-used { font-size: 17px; font-weight: 700; }
    .usage-used.ok { color: var(--green); }
    .usage-used.warn { color: #eab308; }
    .usage-used.hot { color: var(--orange); }
    .usage-limit { margin-top: 10px; }
    .usage-limit .lr {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 13px; color: var(--muted);
    }
    .usage-limit .lr b { color: var(--text); font-weight: 600; }
    .usage-bar {
      height: 6px; border-radius: 999px; background: var(--track);
      overflow: hidden; margin-top: 6px;
    }
    .usage-bar > span { display: block; height: 100%; border-radius: inherit; }
    .usage-note { font-size: 13px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="nav">
      <div class="nav-left">
        <button class="menu-btn hidden" id="menuBtn" type="button" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <div>
          <div class="eyebrow" id="eyebrow">My Laptop</div>
          <h1 id="deviceName">Laptop</h1>
        </div>
      </div>
      <div id="state" class="pill">Connecting</div>
    </div>
    <p class="hint" id="subtitle" style="margin: 4px 4px 0;">Sign in with the permanent laptop password.</p>

    <section id="login" class="card pad">
      <label class="f-label" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="btn" id="loginBtn" type="button">Connect</button>
      <p class="hint">This password stays on the laptop. Set or reset it from the setup page on the PC.</p>
      <p class="error" id="loginError"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div id="view-home">
        <div class="card stats">
          <div class="stat">
            <span class="stat-icon battery" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 7.25H5.75A2.75 2.75 0 0 0 3 10v4a2.75 2.75 0 0 0 2.75 2.75H16.5A2.75 2.75 0 0 0 19.25 14v-.75H20.5a.75.75 0 0 0 .75-.75v-1a.75.75 0 0 0-.75-.75h-1.25V10A2.75 2.75 0 0 0 16.5 7.25Zm-1.25 2.5v4.5H6.25v-4.5h9Z"/></svg>
            </span>
            <b id="battery">—</b>
            <span class="stat-label">Battery</span>
          </div>
          <div class="stat">
            <span class="stat-icon cpu" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3.75h1.5V6H9zm4.5 0H15V6h-1.5zM9 18h1.5v2.25H9zm4.5 0H15v2.25h-1.5zM3.75 9H6v1.5H3.75zm0 4.5H6V15H3.75zM18 9h2.25v1.5H18zm0 4.5h2.25V15H18zM8.25 8.25h7.5v7.5h-7.5zm1.8 1.8v3.9h3.9v-3.9z"/></svg>
            </span>
            <b id="cpu">—</b>
            <span class="stat-label">CPU</span>
          </div>
          <div class="stat">
            <span class="stat-icon ram" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4.75 7.5h14.5A1.75 1.75 0 0 1 21 9.25v6.5A1.75 1.75 0 0 1 19.25 17.5h-1.5v1.25h-1.5V17.5h-2.5v1.25h-1.5V17.5h-2.5v1.25H8.25V17.5h-2.5v1.25H4.25V17.5h-.5A1.75 1.75 0 0 1 2 15.75v-6.5A1.75 1.75 0 0 1 3.75 7.5H4.75Zm1.5 2.25v4.5h11.5v-4.5Z"/></svg>
            </span>
            <b id="ram">—</b>
            <span class="stat-label">RAM</span>
          </div>
        </div>

        <div class="group-title">Apps</div>
        <div class="card" id="apps"><div class="row"><div class="info"><div class="name">Loading…</div></div></div></div>

        <div class="group-title">Media</div>
        <div class="card">
          <div class="row" style="cursor: default;">
            <div class="info">
              <div class="name">Volume</div>
              <input id="volume" type="range" min="0" max="100" value="50" />
            </div>
          </div>
          <button class="row" id="muteRow" type="button" role="switch" aria-checked="false">
            <div class="info"><div class="name">Mute</div><div class="sub" id="volumeValue">—</div></div>
            <span class="sw" id="muteSw"></span>
          </button>
          <button class="row" id="screenshotRow" type="button">
            <div class="info"><div class="name">Screenshot</div><div class="sub">Tap to capture the laptop screen</div></div>
            <span class="sw" id="shotSw"></span>
          </button>
        </div>
        <img id="preview" class="preview" alt="Laptop screenshot" />

        <div class="group-title">Power</div>
        <div class="card">
          <button class="row" type="button" data-power="sleep">
            <span class="dot blue"></span>
            <div class="info"><div class="name">Sleep</div><div class="sub">Suspend now</div></div>
            <span class="sw"></span>
          </button>
          <button class="row" type="button" data-power="lock">
            <span class="dot purple"></span>
            <div class="info"><div class="name">Lock</div><div class="sub">Lock the workstation</div></div>
            <span class="sw"></span>
          </button>
          <button class="row" type="button" data-power="restart" data-confirm="Restart the laptop? Open apps may close.">
            <span class="dot orange"></span>
            <div class="info"><div class="name">Restart</div><div class="sub">Reboot the laptop</div></div>
            <span class="sw"></span>
          </button>
          <button class="row danger" type="button" data-power="shutdown" data-confirm="Shut down the laptop? You will not be able to start it from this page.">
            <span class="dot red"></span>
            <div class="info"><div class="name">Shut Down</div><div class="sub">Power off completely</div></div>
            <span class="sw"></span>
          </button>
        </div>

        <div class="card">
          <button class="row danger" id="logout" type="button">
            <div class="info"><div class="name">Sign Out</div><div class="sub">Sign out on this browser</div></div>
          </button>
        </div>
      </div>

      <div id="view-usage" class="hidden">
        <div class="card" id="throttle">
          <div class="row"><div class="info"><div class="name">Loading model usage…</div></div></div>
        </div>
      </div>

      <div id="view-services" class="hidden">
        <div class="card" id="services"><div class="row"><div class="info"><div class="name">Loading…</div></div></div></div>
      </div>
      <p class="toast" id="message"></p>
    </section>
  </main>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div class="eyebrow">Menu</div>
        <h1 style="font-size: 28px;">Laptop Remote</h1>
      </div>
      <button class="icon-btn" id="drawerClose" type="button" aria-label="Close menu">×</button>
    </div>
    <nav class="drawer-nav">
      <button class="drawer-item active" type="button" data-view="home">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3.2 4 10.1V21h6.2v-6.4h3.6V21H20V10.1z"/></svg>
        </span>
        <span class="info"><span class="name">Home</span><span class="sub">Apps, media, and power</span></span>
      </button>
      <button class="drawer-item" type="button" data-view="usage">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm1 1.1V12l5.7 3.3-.9 1.6L11 13V4.1h2z"/></svg>
        </span>
        <span class="info"><span class="name">Usage</span><span class="sub">Claude, Cursor, Codex, Gemini</span></span>
      </button>
      <button class="drawer-item" type="button" data-view="services">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v3A2.5 2.5 0 0 1 17.5 12h-11A2.5 2.5 0 0 1 4 9.5zm0 8A2.5 2.5 0 0 1 6.5 12h11a2.5 2.5 0 0 1 2.5 2.5v3A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5zM7 7.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm0 8a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
        </span>
        <span class="info"><span class="name">Services</span><span class="sub">Start or stop laptop servers</span></span>
      </button>
    </nav>
  </aside>
  <script>
    const TOKEN_KEY = "laptop-remote-token";
    function apiRoot() {
      const path = location.pathname.replace(/\/+$/, "") || "/";
      if (path.endsWith("/app")) {
        return path.slice(0, -4) || "";
      }
      return path === "/" ? "" : path;
    }
    function api(path) {
      return apiRoot() + "/api/v1" + path;
    }
    async function request(path, options = {}) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = { Accept: "application/json", ...(options.headers || {}) };
      if (options.body && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }
      if (token) {
        headers.Authorization = "Bearer " + token;
      }
      const response = await fetch(api(path), { ...options, headers });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.detail || "Request failed");
      }
      return payload;
    }

    const loginEl = document.getElementById("login");
    const dashEl = document.getElementById("dashboard");
    const loginError = document.getElementById("loginError");
    const message = document.getElementById("message");
    const menuBtn = document.getElementById("menuBtn");
    const drawer = document.getElementById("drawer");
    const scrim = document.getElementById("scrim");
    let deviceLabel = "Laptop";
    let currentView = "home";

    function setSw(el, on) {
      el.classList.toggle("on", !!on);
    }

    function assetUrl(path) {
      if (!path) return "";
      if (path.startsWith("http") || path.startsWith("data:")) return path;
      return apiRoot() + path;
    }

    function applyChrome() {
      const eyebrow = document.getElementById("eyebrow");
      const title = document.getElementById("deviceName");
      if (currentView === "usage") {
        eyebrow.textContent = "Usage";
        title.textContent = "Model usage";
      } else if (currentView === "services") {
        eyebrow.textContent = "Services";
        title.textContent = "Servers";
      } else {
        eyebrow.textContent = "My Laptop";
        title.textContent = deviceLabel;
      }
      document.querySelectorAll(".drawer-item").forEach((item) => {
        item.classList.toggle("active", item.dataset.view === currentView);
      });
    }

    function openMenu() {
      drawer.classList.add("open");
      scrim.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }
    function closeMenu() {
      const focused = document.activeElement;
      if (focused && drawer.contains(focused) && typeof focused.blur === "function") {
        focused.blur();
      }
      drawer.classList.remove("open");
      scrim.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }
    function showView(name) {
      currentView = name;
      document.getElementById("view-home").classList.toggle("hidden", name !== "home");
      document.getElementById("view-usage").classList.toggle("hidden", name !== "usage");
      document.getElementById("view-services").classList.toggle("hidden", name !== "services");
      applyChrome();
      closeMenu();
      if (name === "usage") {
        void loadThrottle();
      }
      if (name === "services") {
        void loadServices();
      }
    }

    function showDashboard() {
      loginEl.classList.add("hidden");
      dashEl.classList.remove("hidden");
      menuBtn.classList.remove("hidden");
      document.getElementById("subtitle").textContent = "Controls stay available until you sign out of this browser.";
      showView("home");
      refresh();
    }
    function showLogin() {
      dashEl.classList.add("hidden");
      loginEl.classList.remove("hidden");
      menuBtn.classList.add("hidden");
      closeMenu();
      currentView = "home";
      document.getElementById("eyebrow").textContent = "My Laptop";
    }

    async function login() {
      loginError.textContent = "";
      try {
        const result = await request("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            password: document.getElementById("password").value,
            client_name: "Web",
          }),
        });
        localStorage.setItem(TOKEN_KEY, result.device_token);
        deviceLabel = result.device_name;
        applyChrome();
        showDashboard();
        startStatusTimer();
      } catch (error) {
        loginError.textContent = error.message;
      }
    }

    async function fetchBinary(path) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = {};
      if (token) {
        headers.Authorization = "Bearer " + token;
      }
      const response = await fetch(api(path), { headers });
      if (!response.ok) {
        throw new Error("Screenshot failed");
      }
      return response.blob();
    }

    function applyVolume(vol) {
      document.getElementById("volume").value = String(vol.volume_percent);
      document.getElementById("volumeValue").textContent = vol.volume_percent + "%";
      const row = document.getElementById("muteRow");
      row.setAttribute("aria-checked", vol.muted ? "true" : "false");
      setSw(document.getElementById("muteSw"), vol.muted);
      row.querySelector(".name").textContent = vol.muted ? "Unmute" : "Mute";
    }

    async function loadVolume() {
      applyVolume(await request("/media/volume"));
    }

    async function setVolume(payload) {
      applyVolume(await request("/media/volume", { method: "POST", body: JSON.stringify(payload) }));
    }

    let volumeTimer = null;
    function queueVolume(percent) {
      document.getElementById("volumeValue").textContent = percent + "%";
      clearTimeout(volumeTimer);
      volumeTimer = setTimeout(() => {
        void setVolume({ volume_percent: percent }).catch((error) => {
          message.textContent = error.message;
        });
      }, 180);
    }

    async function loadScreenshot(btn) {
      const sw = document.getElementById("shotSw");
      setSw(sw, true);
      message.textContent = "Capturing…";
      try {
        const blob = await fetchBinary("/media/screenshot");
        const img = document.getElementById("preview");
        if (img.dataset.url) {
          URL.revokeObjectURL(img.dataset.url);
        }
        const url = URL.createObjectURL(blob);
        img.dataset.url = url;
        img.src = url;
        img.classList.add("show");
        message.textContent = "Screenshot updated";
      } catch (error) {
        message.textContent = error.message;
      } finally {
        setTimeout(() => setSw(sw, false), 600);
      }
    }

    function renderServices(services) {
      const box = document.getElementById("services");
      box.innerHTML = "";
      if (!services.length) {
        box.innerHTML = '<div class="row"><div class="info"><div class="name">No services</div></div></div>';
        return;
      }
      for (const svc of services) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row";
        btn.setAttribute("role", "switch");
        btn.setAttribute("aria-checked", svc.running ? "true" : "false");
        const port = svc.port != null ? " · :" + svc.port : "";
        if (svc.logo) {
          const logo = document.createElement("img");
          logo.className = "logo";
          logo.alt = "";
          logo.src = assetUrl(svc.logo);
          btn.appendChild(logo);
        } else {
          const dot = document.createElement("span");
          dot.className = "dot" + (svc.running ? " on" : "");
          btn.appendChild(dot);
        }
        const name = document.createElement("div");
        name.className = "info";
        const title = document.createElement("div");
        title.className = "name";
        title.textContent = svc.name;
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = (svc.running ? "On" : "Off") + (svc.description ? " · " + svc.description : "") + port;
        name.appendChild(title);
        name.appendChild(sub);
        const sw = document.createElement("span");
        sw.className = "sw" + (svc.running ? " on" : "");
        btn.appendChild(name);
        btn.appendChild(sw);
        btn.addEventListener("click", () => toggleService(svc, btn));
        box.appendChild(btn);
      }
    }

    async function loadServices() {
      try {
        const result = await request("/services");
        renderServices(result.services || []);
      } catch (error) {
        document.getElementById("services").innerHTML =
          '<div class="row"><div class="info"><div class="name">Services unavailable</div></div></div>';
      }
    }

    async function toggleService(svc, btn) {
      const willRun = btn.getAttribute("aria-checked") !== "true";
      if (!willRun && svc.confirm_stop && !confirm(svc.confirm_stop)) {
        return;
      }
      btn.disabled = true;
      const sw = btn.querySelector(".sw");
      btn.setAttribute("aria-checked", willRun ? "true" : "false");
      setSw(sw, willRun);
      try {
        const result = await request("/services/" + svc.id + "/toggle", {
          method: "POST",
          body: "{}",
        });
        message.textContent = result.message || "Service toggled";
        if (result.services) {
          renderServices(result.services);
        } else {
          await loadServices();
        }
        void refreshState();
      } catch (error) {
        message.textContent = error.message;
        btn.setAttribute("aria-checked", willRun ? "false" : "true");
        setSw(sw, !willRun);
      } finally {
        btn.disabled = false;
      }
    }

    function renderApps(apps) {
      const box = document.getElementById("apps");
      box.innerHTML = "";
      for (const app of apps) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row";
        btn.setAttribute("role", "switch");
        btn.setAttribute("aria-checked", app.running ? "true" : "false");
        const logo = document.createElement("img");
        logo.className = "logo";
        logo.alt = "";
        if (app.logo) {
          logo.src = app.logo;
        }
        const name = document.createElement("div");
        name.className = "info";
        const title = document.createElement("div");
        title.className = "name";
        title.textContent = app.name;
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = app.running ? "Running" : "Closed";
        name.appendChild(title);
        name.appendChild(sub);
        const sw = document.createElement("span");
        sw.className = "sw" + (app.running ? " on" : "");
        btn.appendChild(logo);
        btn.appendChild(name);
        btn.appendChild(sw);
        btn.addEventListener("click", () => toggleApp(app, btn));
        box.appendChild(btn);
      }
    }

    async function loadApps() {
      try {
        const result = await request("/apps");
        renderApps(result.apps || []);
      } catch (error) {
        document.getElementById("apps").innerHTML =
          '<div class="row"><div class="info"><div class="name">Apps unavailable</div></div></div>';
      }
    }

    async function toggleApp(app, btn) {
      const willRun = btn.getAttribute("aria-checked") !== "true";
      if (!willRun && !confirm("Quit " + app.name + "? Unsaved work may be lost.")) {
        return;
      }
      btn.disabled = true;
      const sw = btn.querySelector(".sw");
      btn.setAttribute("aria-checked", willRun ? "true" : "false");
      setSw(sw, willRun);
      try {
        const result = await request("/apps/" + app.id + "/toggle", {
          method: "POST",
          body: "{}",
        });
        message.textContent = result.message || "App toggled";
        if (result.apps) {
          renderApps(result.apps);
        } else {
          await loadApps();
        }
      } catch (error) {
        message.textContent = error.message;
        btn.setAttribute("aria-checked", willRun ? "false" : "true");
        setSw(sw, !willRun);
      } finally {
        btn.disabled = false;
      }
    }

    function usageTone(percent) {
      if (percent == null || !Number.isFinite(Number(percent))) return "";
      if (percent >= 70) return "hot";
      if (percent >= 50) return "warn";
      return "ok";
    }
    function usageBarColor(percent) {
      if (percent >= 70) return "var(--orange)";
      if (percent >= 50) return "#eab308";
      return "var(--green)";
    }
    function providerLogo(id) {
      const files = { claude: "claude.svg", cursor: "cursor.svg", codex: "codex.svg", antigravity: "gemini.svg" };
      return files[id] ? apiRoot() + "/assets/throttle/" + files[id] : "";
    }
    function renderThrottle(payload) {
      const box = document.getElementById("throttle");
      box.innerHTML = "";
      const providers = payload.providers || [];
      if (!providers.length) {
        const empty = document.createElement("div");
        empty.className = "row";
        empty.innerHTML = '<div class="info"><div class="name">No usage data</div></div>';
        box.appendChild(empty);
        return;
      }
      for (const provider of providers) {
        const tile = document.createElement("div");
        tile.className = "usage-tile";
        const head = document.createElement("div");
        head.className = "usage-head";
        const mark = document.createElement("div");
        mark.className = "usage-mark " + provider.id;
        const logo = document.createElement("img");
        logo.alt = "";
        logo.src = providerLogo(provider.id);
        mark.appendChild(logo);
        const meta = document.createElement("div");
        meta.className = "usage-meta";
        const top = document.createElement("div");
        top.className = "usage-top";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = provider.name;
        const used = document.createElement("div");
        used.className = "usage-used " + usageTone(provider.used_percent);
        used.textContent = provider.used_percent == null ? "—" : Math.round(provider.used_percent) + "%";
        top.appendChild(name);
        top.appendChild(used);
        const plan = document.createElement("div");
        plan.className = "usage-plan";
        if (provider.status === "connected") {
          plan.textContent = [provider.plan_type, provider.remaining_label].filter(Boolean).join(" · ") || "Connected";
        } else if (provider.status === "disconnected") {
          plan.textContent = "Sign in on this laptop";
        } else {
          plan.textContent = "Unavailable";
        }
        meta.appendChild(top);
        meta.appendChild(plan);
        head.appendChild(mark);
        head.appendChild(meta);
        tile.appendChild(head);
        if (provider.status === "connected") {
          for (const limit of provider.limits || []) {
            const block = document.createElement("div");
            block.className = "usage-limit";
            const lr = document.createElement("div");
            lr.className = "lr";
            const label = document.createElement("span");
            label.textContent = limit.label;
            const pct = document.createElement("b");
            pct.textContent = Math.round(limit.used_percent) + "% used";
            lr.appendChild(label);
            lr.appendChild(pct);
            const bar = document.createElement("div");
            bar.className = "usage-bar";
            const fill = document.createElement("span");
            fill.style.width = Math.round(limit.used_percent) + "%";
            fill.style.background = usageBarColor(limit.used_percent);
            bar.appendChild(fill);
            block.appendChild(lr);
            block.appendChild(bar);
            if (limit.reset_label) {
              const note = document.createElement("div");
              note.className = "usage-note";
              note.textContent = limit.reset_label;
              block.appendChild(note);
            }
            tile.appendChild(block);
          }
        } else if (provider.error) {
          const note = document.createElement("div");
          note.className = "usage-note";
          note.textContent = provider.error;
          tile.appendChild(note);
        }
        box.appendChild(tile);
      }
      const refreshBtn = document.createElement("button");
      refreshBtn.type = "button";
      refreshBtn.className = "row";
      refreshBtn.innerHTML =
        '<div class="info"><div class="name">Refresh usage</div><div class="sub">Reads Claude, Cursor, Codex, and Gemini sessions on this PC</div></div>';
      refreshBtn.addEventListener("click", () => {
        void loadThrottle(true);
      });
      box.appendChild(refreshBtn);
    }
    async function loadThrottle(force) {
      const box = document.getElementById("throttle");
      try {
        if (force) {
          message.textContent = "Refreshing model usage…";
        }
        const result = await request("/throttle" + (force ? "?refresh=true" : ""));
        renderThrottle(result);
        if (force) {
          message.textContent = "Model usage updated";
        }
      } catch (error) {
        box.innerHTML = "";
        const row = document.createElement("div");
        row.className = "row";
        const info = document.createElement("div");
        info.className = "info";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = "Throttle unavailable";
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = error.message;
        info.appendChild(name);
        info.appendChild(sub);
        row.appendChild(info);
        box.appendChild(row);
        if (force) {
          message.textContent = error.message;
        }
      }
    }

    async function refreshState() {
      try {
        const status = await request("/status");
        deviceLabel = status.device_name;
        applyChrome();
        const pill = document.getElementById("state");
        pill.textContent = "Online";
        pill.className = "pill on";
        document.getElementById("battery").textContent =
          status.battery_percent == null ? "AC" : status.battery_percent + "%";
        document.getElementById("cpu").textContent = Math.round(status.cpu_percent) + "%";
        document.getElementById("ram").textContent =
          status.ram_used_gb.toFixed(1) + "/" + status.ram_total_gb.toFixed(0);
      } catch (error) {
        const pill = document.getElementById("state");
        pill.textContent = "Offline";
        pill.className = "pill";
        message.textContent = error.message;
        throw error;
      }
    }

    async function refresh() {
      try {
        await refreshState();
        if (currentView === "home") {
          await loadVolume();
          await loadApps();
        } else if (currentView === "usage") {
          void loadThrottle();
        } else if (currentView === "services") {
          await loadServices();
        }
      } catch (error) {
        /* state already shown */
      }
    }

    async function power(command, btn) {
      const row = btn.closest(".row");
      const sw = row ? row.querySelector(".sw") : null;
      const confirmText = btn.dataset.confirm;
      if (confirmText && !confirm(confirmText)) {
        return;
      }
      if (sw) {
        setSw(sw, true);
      }
      try {
        const result = await request("/power/" + command, { method: "POST", body: "{}" });
        message.textContent = result.message;
      } catch (error) {
        message.textContent = error.message;
      } finally {
        setTimeout(() => {
          if (sw) {
            setSw(sw, false);
          }
        }, 800);
      }
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("password").addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });
    document.querySelectorAll("[data-power]").forEach((btn) => {
      btn.addEventListener("click", () => power(btn.dataset.power, btn));
    });
    document.getElementById("volume").addEventListener("input", (event) => {
      queueVolume(Number(event.target.value));
    });
    document.getElementById("muteRow").addEventListener("click", async () => {
      const muted = document.getElementById("muteRow").getAttribute("aria-checked") === "true";
      try {
        await setVolume({ muted: !muted });
      } catch (error) {
        message.textContent = error.message;
      }
    });
    document.getElementById("screenshotRow").addEventListener("click", () => {
      void loadScreenshot();
    });
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      showLogin();
    });
    menuBtn.addEventListener("click", openMenu);
    document.getElementById("drawerClose").addEventListener("click", closeMenu);
    scrim.addEventListener("click", closeMenu);
    document.querySelectorAll(".drawer-item").forEach((item) => {
      item.addEventListener("click", () => showView(item.dataset.view));
    });

    let statusTimer = null;
    function startStatusTimer() {
      if (statusTimer) {
        return;
      }
      statusTimer = setInterval(refresh, 15000);
    }
    if (localStorage.getItem(TOKEN_KEY)) {
      showDashboard();
      startStatusTimer();
    }
  </script>
</body>
</html>
